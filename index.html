<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINAMI CASSETTE RADIO DECK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d11;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .cassette-deck {
      background: linear-gradient(145deg, #23242a, #16171b);
      border: 4px solid #3b3d45;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1);
      position: relative;
    }
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #33353d;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .brand-title {
      color: #f59e0b;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }
    .radio-badge {
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* Cassette Tape Window */
    .tape-window {
      background: #050507;
      border: 3px solid #2a2b32;
      border-radius: 10px;
      padding: 15px;
      position: relative;
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
    }
    .tape-body {
      background: #1e1f25;
      border: 2px solid #383a42;
      border-radius: 8px;
      height: 140px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .tape-label {
      background: #fef08a;
      color: #111827;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #eab308;
    }
    .reels-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 10px 0;
      position: relative;
    }
    .reel {
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #4b5563 20%, #111827 60%);
      border: 4px solid #9ca3af;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .reel-center {
      width: 16px;
      height: 16px;
      background: #1f2937;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      position: relative;
      z-index: 2;
    }
    /* Chấu quay bên trong cuộn băng */
    .reel-teeth {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .reel-teeth::before, .reel-teeth::after {
      content: '';
      position: absolute;
      background: #9ca3af;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .reel-teeth::before { width: 4px; height: 100%; }
    .reel-teeth::after { width: 100%; height: 4px; }

    /* Hiệu ứng quay cuộn băng */
    .spinning .reel-teeth {
      animation: spinTape 2.5s linear infinite;
    }
    @keyframes spinTape {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tape-center-window {
      width: 70px;
      height: 25px;
      background: #000;
      border: 1px solid #4b5563;
      border-radius: 4px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .tape-line {
      width: 80%;
      height: 8px;
      background: #78350f;
      border-radius: 2px;
    }

    /* Screen display */
    .lcd-screen {
      background: #064e3b;
      color: #34d399;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #047857;
      font-family: monospace;
      margin-bottom: 20px;
      text-shadow: 0 0 5px rgba(52, 211, 153, 0.6);
    }
    .lcd-status { font-size: 11px; opacity: 0.8; }
    .lcd-title { font-size: 15px; font-weight: bold; margin: 4px 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* Cassette Hardware Buttons */
    .controls-deck {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .btn-cassette {
      flex: 1;
      background: linear-gradient(180deg, #4b5563, #1f2937);
      color: #f3f4f6;
      border: 2px solid #374151;
      border-bottom: 5px solid #111827;
      padding: 12px 0;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      text-shadow: 0 1px 2px #000;
      transition: all 0.1s ease;
    }
    .btn-cassette:active {
      border-bottom-width: 2px;
      transform: translateY(3px);
    }
    .btn-play-rec {
      background: linear-gradient(180deg, #dc2626, #991b1b) !important;
      border-color: #b91c1c !important;
      border-bottom-color: #450a0a !important;
    }

    /* Lists */
    .section-title { color: #f59e0b; font-size: 12px; font-weight: bold; margin: 15px 0 6px 0; }
    .artist-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .artist-chip {
      background: #272732;
      color: #f59e0b;
      border: 1px solid #b45309;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .artist-chip.active { background: #b45309; color: #fff; }
    .playlist-box {
      max-height: 200px;
      overflow-y: auto;
      background: #09090d;
      border: 1px solid #272732;
      border-radius: 6px;
    }
    .track-item {
      padding: 8px 12px;
      border-bottom: 1px solid #1a1a24;
      cursor: pointer;
      font-size: 12px;
    }
    .track-item:hover { background: #1b1b26; }
    .track-item.active { background: #2a2a3c; border-left: 3px solid #f59e0b; }
    .track-name { font-weight: bold; color: #fff; }
    .track-sub { color: #6b7280; font-size: 10px; }
  </style>
</head>
<body>

<div class="cassette-deck">
  <div class="deck-header">
    <div class="brand-title">MINAMI STEREO</div>
    <div class="radio-badge">CASSETTE DECK</div>
  </div>

  <!-- Cassette Tape Display -->
  <div class="tape-window">
    <div class="tape-body">
      <div class="tape-label">
        <span>MINAMI HIGH-POSITION C-90</span>
        <span id="tapeSide">SIDE A</span>
      </div>
      
      <div class="reels-container" id="reelsContainer">
        <div class="reel"><div class="reel-teeth"></div><div class="reel-center"></div></div>
        <div class="tape-center-window"><div class="tape-line"></div></div>
        <div class="reel"><div class="reel-teeth"></div><div class="reel-center"></div></div>
      </div>

      <div style="font-size: 9px; color: #6b7280; text-align: center;">AUTO REVERSE • NOISE REDUCTION</div>
    </div>
  </div>

  <!-- LCD Screen -->
  <div class="lcd-screen">
    <div class="lcd-status" id="lcdStatus">STOPPED • TAPE READY</div>
    <div class="lcd-title" id="lcdTitle">CHỌN BÀI HÁT ĐỂ PHÁT</div>
    <div class="lcd-status" id="lcdArtist">ARTIST: UNKNOWN</div>
<div style="margin-top: 8px; font-size: 13px; color: #a3e635; opacity: 0.9; font-weight: bold;">TIME: <span id="current-time">00:00</span> / <span id="duration">00:00</span></div>
  </div>

  <!-- Hardware Buttons -->
  <div class="controls-deck">
    <button class="btn-cassette" onclick="prevTrack()">⏮ PREV</button>
    <button class="btn-cassette btn-play-rec" onclick="togglePlay()">▶ PLAY/PAUSE</button>

    <button class="btn-cassette" onclick="nextTrack()">⏭ NEXT</button>
  </div>

  <div class="section-title">🎤 CA SĨ:</div>
  <div id="artistContainer" class="artist-bar"></div>

  <div class="section-title">🎵 DANH SÁCH BÀI HÁT:</div>
  <div id="playlist" class="playlist-box"></div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  var songs = [];
  var currentIndex = 0;
  var currentFilteredList = [];
  var audio = document.getElementById('audioPlayer');

  window.addEventListener('DOMContentLoaded', function() {
    fetch('songs.json')
      .then(res => res.json())
      .then(data => {
        songs = data;
        renderArtists();
        renderPlaylist(songs);
      })
      .catch(err => console.error('Lỗi nạp songs.json:', err));

    audio.addEventListener('ended', function() {
      nextTrack();
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => { audio.play(); setSpinning(true); });
      navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); setSpinning(false); });
      navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
      navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
    }
  });

  function setSpinning(isSpinning) {
    var reels = document.getElementById('reelsContainer');
    if (isSpinning) {
      reels.classList.add('spinning');
    } else {
      reels.classList.remove('spinning');
    }
  }

  function updateMediaSession(title, artist) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: artist,
        album: 'Minami Cassette Deck'
      });
    }
  }

  function renderArtists() {
    var container = document.getElementById('artistContainer');
    container.innerHTML = '<div class="artist-chip active" onclick="filterArtist(\'\', this)">TẤT CẢ</div>';
    var artists = [...new Set(songs.map(s => s.artist || 'Khác').filter(Boolean))].sort();
    artists.forEach(function(a) {
      var chip = document.createElement('div');
      chip.className = 'artist-chip';
      chip.textContent = a;
      chip.onclick = function() { filterArtist(a, this); };
      container.appendChild(chip);
    });
  }

  function renderPlaylist(list) {
    currentFilteredList = list;
    var pl = document.getElementById('playlist');
    pl.innerHTML = '';
    list.forEach(function(s, idx) {
      var item = document.createElement('div');
      item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
      var title = s.title || s.src || 'Không tên';
      var artist = s.artist || 'Chưa rõ';
      
      item.innerHTML = '<div class="track-name">' + (idx + 1) + '. ' + title + '</div>' +
                       '<div class="track-sub">🎤 ' + artist + '</div>';
      item.onclick = function() { playTrack(idx); };
      pl.appendChild(item);
    });
  }

  function filterArtist(artist, el) {
    document.querySelectorAll('.artist-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    var filtered = artist ? songs.filter(s => s.artist === artist) : songs;
    renderPlaylist(filtered);
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= currentFilteredList.length) return;
    currentIndex = idx;
    var s = currentFilteredList[currentIndex];
    
    var title = s.title || s.src || 'Không tên';
    var artist = s.artist || 'Chưa rõ';

    document.getElementById('lcdTitle').textContent = title;
    document.getElementById('lcdArtist').textContent = 'ARTIST: ' + artist;
    document.getElementById('lcdStatus').textContent = 'PLAYING • CASSETTE TAPE';
    
    renderPlaylist(currentFilteredList);
    updateMediaSession(title, artist);

    if (s.src) {
      audio.src = s.src;
      audio.play().then(() => {
        setSpinning(true);
      }).catch(e => console.log('Lỗi phát nhạc:', e));
    }
  }

  function togglePlay() {
    if (!audio.src && currentFilteredList.length > 0) {
      playTrack(0);
      return;
    }
    if (audio.paused) {
      audio.play();
      setSpinning(true);
      document.getElementById('lcdStatus').textContent = 'PLAYING • CASSETTE TAPE';
    } else {
      audio.pause();
      setSpinning(false);
      document.getElementById('lcdStatus').textContent = 'PAUSED • TAPE STOPPED';
    }
  }

  function prevTrack() {
    var nextIdx = currentIndex > 0 ? currentIndex - 1 : currentFilteredList.length - 1;
    playTrack(nextIdx);
  }

  function nextTrack() {
    var nextIdx = currentIndex < currentFilteredList.length - 1 ? currentIndex + 1 : 0;
    playTrack(nextIdx);
  }
</script>


<script>
document.addEventListener('DOMContentLoaded', () => {
    const audio = document.querySelector('audio');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    function formatTime(sec) {
        if (isNaN(sec) || sec === Infinity) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    if (audio) {
        audio.addEventListener('timeupdate', () => {
            if (currentTimeEl) currentTimeEl.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            if (durationEl) durationEl.textContent = formatTime(audio.duration);
        });
    }
});
</script>

</body>
</html>
