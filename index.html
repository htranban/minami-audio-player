<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Cassette Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #eaeaea;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Khung đài Cassette */
    .cassette-deck {
      background: linear-gradient(145deg, #2c2c2c, #1f1f1f);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      border: 1px solid #3d3d3d;
      position: relative;
    }

    /* Tiêu đề & Màn hình LED */
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #151515;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2px;
      color: #d1d1d1;
      text-transform: uppercase;
    }

    /* Màn hình hiển thị thời gian LED */
    .lcd-display {
      background-color: #080d08;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #004d1a;
      box-shadow: inset 0 0 6px rgba(0, 255, 102, 0.3);
      letter-spacing: 1px;
    }

    /* Khung băng Cassette */
    .tape-window {
      background: #111;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #333;
      margin-bottom: 20px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
    }

    .tape-body {
      background: #252525;
      height: 130px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid #444;
      position: relative;
    }

    .tape-wheels {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 10px;
    }

    .wheel {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #555 30%, #111 70%);
      border: 4px dashed #888;
      transition: transform 0.1s linear;
    }

    .playing .wheel {
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Thông tin bài hát */
    .song-info {
      text-align: center;
      margin-top: 10px;
    }

    .song-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffca28;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: #aaa;
      margin-top: 4px;
    }

    /* Các nút bấm cơ khí */
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      background: linear-gradient(180deg, #444, #222);
      color: #fff;
      border: 1px solid #555;
      padding: 12px 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #111;
      transition: all 0.1s ease;
      text-align: center;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #111;
    }

    /* Danh sách chọn bài */
    .playlist-section {
      margin-top: 20px;
    }

    .playlist-select {
      width: 100%;
      padding: 10px;
      background: #181818;
      color: #ddd;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .playlist-select:focus {
      border-color: #ffca28;
    }
  </style>
</head>
<body>

  <div class="cassette-deck">
    <!-- Header đài & Màn hình hiển thị thời gian -->
    <div class="deck-header">
      <div class="brand-title">STEREO CASSETTE</div>
      <div class="lcd-display">
        <span id="current-time">00:00</span> / <span id="duration">00:00</span>
      </div>
    </div>

    <!-- Khung quay băng -->
    <div class="tape-window">
      <div class="tape-body" id="tape-body">
        <div class="tape-wheels">
          <div class="wheel"></div>
          <div class="wheel"></div>
        </div>
        <div class="song-info">
          <div class="song-title" id="song-title">Chọn bài hát...</div>
          <div class="song-artist" id="song-artist">--</div>
        </div>
      </div>
    </div>

    <!-- Bộ nút bấm -->
    <div class="controls">
      <button class="btn" id="btn-prev">⏮ PREV</button>
      <button class="btn" id="btn-play">▶ PLAY</button>
      <button class="btn" id="btn-pause">⏸ PAUSE</button>
      <button class="btn" id="btn-next">NEXT ⏭</button>
    </div>

    <!-- Danh sách bài hát -->
    <div class="playlist-section">
      <select id="song-select" class="playlist-select">
        <option value="">-- Đang tải danh sách bài hát --</option>
      </select>
    </div>

    <audio id="audio-player"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');
    const songSelect = document.getElementById('song-select');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const tapeBody = document.getElementById('tape-body');

    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    let songs = [];
    let currentIndex = 0;

    // Format thời gian mm:ss
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Tải danh sách từ songs.json
    async function loadSongs() {
      try {
        const response = await fetch('songs.json');
        songs = await response.json();

        songSelect.innerHTML = '';
        songs.forEach((song, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = `${song.id}. ${song.title} - ${song.artist}`;
          songSelect.appendChild(option);
        });

        if (songs.length > 0) {
          loadSong(0);
        }
      } catch (err) {
        songTitle.textContent = "Không tải được danh sách!";
      }
    }

    function loadSong(index) {
      currentIndex = index;
      const song = songs[currentIndex];
      songTitle.textContent = song.title;
      songArtist.textContent = song.artist;
      audio.src = song.src;
      songSelect.value = currentIndex;
      currentTimeEl.textContent = "00:00";
      durationEl.textContent = "00:00";
    }

    function playAudio() {
      audio.play().then(() => {
        tapeBody.classList.add('playing');
      }).catch(e => console.log(e));
    }

    function pauseAudio() {
      audio.pause();
      tapeBody.classList.remove('playing');
    }

    // Event Listeners
    btnPlay.addEventListener('click', playAudio);
    btnPause.addEventListener('click', pauseAudio);

    btnNext.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex);
      playAudio();
    });

    btnPrev.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex);
      playAudio();
    });

    songSelect.addEventListener('change', (e) => {
      loadSong(parseInt(e.target.value));
      playAudio();
    });

    // Cập nhật thời gian hiển thị LED
    audio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      btnNext.click();
    });

    loadSongs();
  </script>
</body>
</html>
