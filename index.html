<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINAMI KAWAII PLAYER 🐾</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe4e1);
      color: #5c4033;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Curif', cursive, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .cute-deck {
      background: #ffffff;
      border: 4px solid #ffb6c1;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5);
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .title {
      color: #ff69b4;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px 0px #fff0f5;
    }

    /* Mascot Cat Animation */
    .mascot-container {
      text-align: center;
      margin: 10px 0;
      position: relative;
    }
    .cat-face {
      font-size: 70px;
      display: inline-block;
      transition: transform 0.3s;
      user-select: none;
    }
    .dancing .cat-face {
      animation: catBounce 0.6s infinite alternate ease-in-out;
    }
    @keyframes catBounce {
      0% { transform: translateY(0) rotate(-5deg) scale(1); }
      100% { transform: translateY(-12deg) rotate(5deg) scale(1.08); }
    }

    /* Screen display */
    .screen {
      background: #fff0f5;
      border: 2px dashed #ffb6c1;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    .status { font-size: 12px; color: #ff1493; font-weight: bold; margin-bottom: 5px; }
    .song-title { font-size: 16px; font-weight: bold; color: #4a4a4a; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: #8b6b61; margin-top: 4px; }

    /* Cute Buttons */
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-cute {
      background: #ffb6c1;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0px #ff69b4;
      transition: all 0.1s ease;
    }
    .btn-cute:active {
      box-shadow: 0 1px 0px #ff69b4;
      transform: translateY(3px);
    }
    .btn-play {
      background: #ff69b4 !important;
      box-shadow: 0 4px 0px #c71585 !important;
      padding: 12px 24px;
    }
    .btn-play:active {
      box-shadow: 0 1px 0px #c71585 !important;
    }

    /* Lists */
    .section-title { color: #ff69b4; font-size: 13px; font-weight: bold; margin: 15px 0 8px 0; }
    .artist-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .artist-chip {
      background: #fff0f5;
      color: #ff69b4;
      border: 1px solid #ffb6c1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: bold;
    }
    .artist-chip.active { background: #ff69b4; color: #fff; }
    .playlist-box {
      max-height: 180px;
      overflow-y: auto;
      background: #faf0e6;
      border: 2px solid #ffe4e1;
      border-radius: 12px;
    }
    .track-item {
      padding: 10px 14px;
      border-bottom: 1px solid #ffe4e1;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .track-item:hover { background: #fff0f5; }
    .track-item.active { background: #ffe4e1; font-weight: bold; color: #ff1493; }
  </style>
</head>
<body>

<div class="cute-deck">
  <div class="header">
    <div class="title">✨ MINAMI KAWAII ✨</div>
  </div>

  <!-- Cat Animation -->
  <div class="mascot-container" id="mascot">
    <div class="cat-face" id="catFace">🐱</div>
  </div>

  <!-- Screen -->
  <div class="screen">
    <div class="status" id="status">SẴN SÀNG PHÁT NHẠC 💕</div>
    <div class="song-title" id="songTitle">CHỌN BÀI HÁT BÊN DƯỚI</div>
    <div class="song-artist" id="songArtist">🐾 --- 🐾</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-cute" onclick="prevTrack()">⏮ Trước</button>
    <button class="btn-cute btn-play" onclick="togglePlay()">▶ Phát / Dừng</button>
    <button class="btn-cute" onclick="nextTrack()">⏭ Tiếp</button>
  </div>

  <div class="section-title">🌸 CA SĨ:</div>
  <div id="artistContainer" class="artist-bar"></div>

  <div class="section-title">🎶 DANH SÁCH BÀI HÁT:</div>
  <div id="playlist" class="playlist-box"></div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  var songs = [];
  var currentIndex = 0;
  var currentFilteredList = [];
  var audio = document.getElementById('audioPlayer');

  window.addEventListener('DOMContentLoaded', function() {
    fetch('songs.json')
      .then(res => res.json())
      .then(data => {
        songs = data;
        renderArtists();
        renderPlaylist(songs);
      })
      .catch(err => console.error('Lỗi nạp songs.json:', err));

    audio.addEventListener('ended', function() { nextTrack(); });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => { audio.play(); setDancing(true); });
      navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); setDancing(false); });
      navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
      navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
    }
  });

  function setDancing(isDancing) {
    var mascot = document.getElementById('mascot');
    var cat = document.getElementById('catFace');
    if (isDancing) {
      mascot.classList.add('dancing');
      cat.textContent = '😸';
    } else {
      mascot.classList.remove('dancing');
      cat.textContent = '🐱';
    }
  }

  function updateMediaSession(title, artist) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: artist,
        album: 'Minami Kawaii Deck'
      });
    }
  }

  function renderArtists() {
    var container = document.getElementById('artistContainer');
    container.innerHTML = '<div class="artist-chip active" onclick="filterArtist(\'\', this)">TẤT CẢ ✨</div>';
    var artists = [...new Set(songs.map(s => s.artist || 'Khác').filter(Boolean))].sort();
    artists.forEach(function(a) {
      var chip = document.createElement('div');
      chip.className = 'artist-chip';
      chip.textContent = a;
      chip.onclick = function() { filterArtist(a, this); };
      container.appendChild(chip);
    });
  }

  function renderPlaylist(list) {
    currentFilteredList = list;
    var pl = document.getElementById('playlist');
    pl.innerHTML = '';
    list.forEach(function(s, idx) {
      var item = document.createElement('div');
      item.className = 'track-item' + (idx === currentIndex ? ' active' : '');
      var title = s.title || s.src || 'Không tên';
      var artist = s.artist || 'Chưa rõ';
      
      item.innerHTML = '<span>' + (idx + 1) + '. ' + title + '</span>' +
                       '<span style="font-size: 10px; opacity:0.7;">' + artist + '</span>';
      item.onclick = function() { playTrack(idx); };
      pl.appendChild(item);
    });
  }

  function filterArtist(artist, el) {
    document.querySelectorAll('.artist-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    var filtered = artist ? songs.filter(s => s.artist === artist) : songs;
    renderPlaylist(filtered);
  }

  function playTrack(idx) {
    if (idx < 0 || idx >= currentFilteredList.length) return;
    currentIndex = idx;
    var s = currentFilteredList[currentIndex];
    
    var title = s.title || s.src || 'Không tên';
    var artist = s.artist || 'Chưa rõ';

    document.getElementById('songTitle').textContent = title;
    document.getElementById('songArtist').textContent = '🎤 ' + artist;
    document.getElementById('status').textContent = 'ĐANG PHÁT NHẠC CỰC CHILL 🎵';
    
    renderPlaylist(currentFilteredList);
    updateMediaSession(title, artist);

    if (s.src) {
      audio.src = s.src;
      audio.play().then(() => {
        setDancing(true);
      }).catch(e => console.log('Lỗi:', e));
    }
  }

  function togglePlay() {
    if (!audio.src && currentFilteredList.length > 0) {
      playTrack(0);
      return;
    }
    if (audio.paused) {
      audio.play();
      setDancing(true);
      document.getElementById('status').textContent = 'ĐANG PHÁT NHẠC CỰC CHILL 🎵';
    } else {
      audio.pause();
      setDancing(false);
      document.getElementById('status').textContent = 'TẠM DỪNG 💤';
    }
  }

  function prevTrack() {
    var nextIdx = currentIndex > 0 ? currentIndex - 1 : currentFilteredList.length - 1;
    playTrack(nextIdx);
  }

  function nextTrack() {
    var nextIdx = currentIndex < currentFilteredList.length - 1 ? currentIndex + 1 : 0;
    playTrack(nextIdx);
  }
</script>

</body>
</html>
